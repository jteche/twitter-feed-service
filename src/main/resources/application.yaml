server:
  port: 8084

spring:
    application:
      name: twitter.feed
    kafka:
      consumer:
        bootstrap-servers: localhost:9092
        group-id: twitter-feed-group
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto-offset-reset: earliest
        properties:
          spring.json.value.default.type: com.kafka.twitter.feed.model.MessageDto
      producer:
        bootstrap-servers: localhost:9092
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
      topic:
        name: twitter-feed-topic
    security:
      disabled: true
      user:
        name: admin
        password: admin

    redis:
      host: localhost
      port: 6379
      password: # leave empty if no password
      timeout: 10000
      database: 0
      jedis:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0
      retry:
        enabled: true
        max-attempts: 3
        backoff:
          initial-interval: 1000
          max-interval: 2000
          multiplier: 1.1